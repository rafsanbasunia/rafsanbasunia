    <g opacity="0.5"><line x1="0" y1="0" x2="0" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="43" y1="0" x2="43" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="86" y1="0" x2="86" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="129" y1="0" x2="129" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="172" y1="0" x2="172" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="215" y1="0" x2="215" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="258" y1="0" x2="258" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="301" y1="0" x2="301" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="344" y1="0" x2="344" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="387" y1="0" x2="387" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="430" y1="0" x2="430" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="473" y1="0" x2="473" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="516" y1="0" x2="516" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="559" y1="0" x2="559" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="602" y1="0" x2="602" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="645" y1="0" x2="645" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="688" y1="0" x2="688" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="731" y1="0" x2="731" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="774" y1="0" x2="774" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="817" y1="0" x2="817" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="860" y1="0" x2="860" y2="260" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="0" x2="860" y2="0" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="43" x2="860" y2="43" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="86" x2="860" y2="86" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="129" x2="860" y2="129" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="172" x2="860" y2="172" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="215" x2="860" y2="215" stroke="#1a2229" stroke-width="1"/><line x1="0" y1="258" x2="860" y2="258" stroke="#1a2229" stroke-width="1"/></g>

    <!-- Accent sweep across the top edge, travelling left to right. -->
    <rect x="0" y="0" width="240" height="2" fill="url(#fade)">
      <animate attributeName="x" values="-240;860" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="44" y="62" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="11" letter-spacing="2.4" fill="#22d3ee">RAFSAN HOSSEN BASUNIA</text>

    <!-- Headline, wiped in by an expanding clip rather than a fade. -->
