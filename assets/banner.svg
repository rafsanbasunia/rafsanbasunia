            font-size="30" font-weight="700" fill="#e7edf2">survive <tspan fill="#22d3ee">bad input</tspan>.</text>
    </g>

    <line x1="44" y1="182" x2="816" y2="182" stroke="#1a2229" stroke-width="1"/>

    
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
    <text x="44" y="216" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="27" font-weight="700" fill="#e7edf2">107</text>
    <text x="44" y="235" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="10.5" letter-spacing="1.6" fill="#6b7a88">STARS</text>
  </g>
    
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.15s" fill="freeze"/>
    <text x="190" y="216" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="27" font-weight="700" fill="#e7edf2">102</text>
    <text x="190" y="235" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="10.5" letter-spacing="1.6" fill="#6b7a88">FORKS</text>
  </g>
    
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
    <text x="336" y="216" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="27" font-weight="700" fill="#e7edf2">22</text>
    <text x="336" y="235" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="10.5" letter-spacing="1.6" fill="#6b7a88">REPOSITORIES</text>
  </g>
    
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.45s" fill="freeze"/>
    <text x="510" y="216" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="27" font-weight="700" fill="#e7edf2">5</text>
    <text x="510" y="235" font-family="ui-monospace,'JetBrains Mono',monospace"
          font-size="10.5" letter-spacing="1.6" fill="#6b7a88">LANGUAGES</text>
  </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
      <text x="816" y="216" text-anchor="end"
            font-family="ui-monospace,'JetBrains Mono',monospace"
            font-size="11.5" fill="#9aa8b5">rafsan.me</text>
      <text x="816" y="235" text-anchor="end"
            font-family="ui-monospace,'JetBrains Mono',monospace"
            font-size="10.5" letter-spacing="1.2" fill="#6b7a88">DHAKA, BANGLADESH</text>
    </g>

    <rect width="860" height="260" rx="8" fill="none" stroke="#1a2229" stroke-width="2"/>
  </g>
